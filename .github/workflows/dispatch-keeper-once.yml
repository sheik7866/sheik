name: Dispatch the keeper once

# One-shot proof harness on a throwaway branch. The keeper's manual entry point
# needs Actions credentials this workspace does not hold, so this push does the
# dispatch with the repository token (workflow_dispatch is the one event
# GITHUB_TOKEN may start a workflow with). It also publishes a report back to
# this branch so a failure is readable from the public API.
on:
  push:
    branches: [keeper-proof]

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Wait for an idle deploy workflow, then dispatch the keeper
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "actor: ${{ github.actor }}"
            echo "sha: ${{ github.sha }}"
            echo "repo: $(gh repo view --json nameWithOwner --jq .nameWithOwner)"
            for i in $(seq 1 40); do
              busy=$(gh run list --workflow=pages.yml --limit 10 --json status \
                --jq '[.[] | select(.status=="queued" or .status=="in_progress")] | length')
              echo "check $i: deploy runs in flight = $busy"
              if [ "$busy" -eq 0 ]; then break; fi
              sleep 15
            done
            echo "dispatching keeper with force=true"
            gh workflow run keep-prices-fresh.yml --ref main -f force=true
            echo "dispatch accepted"
            sleep 12
            gh run list --workflow=keep-prices-fresh.yml --limit 1 \
              --json databaseId,event,status,headSha
          } 2>&1 | tee /tmp/report.txt
      - name: Publish the report to this branch
        if: always()
        run: |
          cp /tmp/report.txt diag-report.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diag-report.txt
          git commit -q -m "Report keeper dispatch attempt" || exit 0
          git push origin HEAD:keeper-proof || true
