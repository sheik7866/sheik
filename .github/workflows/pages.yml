name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # The deterministic trigger is the external cron job (cron-job.org) that
  # calls this workflow's dispatch API hourly from 11:00 to 19:00 UTC. Auckland
  # is UTC+13 in summer and UTC+12 in winter, so that covers local midnight in
  # both seasons (11:00 or 12:00 UTC) and keeps retrying Woolworths until
  # Grocer republishes around 05:00 NZ. The dispatcher's fine-grained token
  # needs Actions: read and write on this repository and lives only in the cron
  # job, never in the repo.
  #
  # The schedule below is only a backstop, because GitHub's scheduler is
  # best-effort: on 25 November no scheduled run landed between 21:18 and 08:08
  # NZ, so the midnight refresh started eight hours late, and fifteen-minute
  # retries delivered nothing at all. It is still worth keeping, because a cron
  # job whose token expired blocks every dispatch silently: on 27 November no
  # dispatch ever reached GitHub and the site served 26 November prices all
  # morning. A delivered slot here at least refreshes the day, and the gate
  # makes every no-op trigger cost one checkout and a jq check.
  #
  # keep-prices-fresh.yml watches the same two dates and dispatches this
  # workflow when they are out of date, so either clock can heal the other and
  # a dead outside clock no longer freezes prices without a sound.
  schedule:
    - cron: "0 11-19 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Refresh every store even if today's prices already exist
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  # A deploy must not cancel the longer nightly price refresh.
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
      refresh: ${{ steps.check.outputs.refresh }}
      wow: ${{ steps.check.outputs.wow }}
    steps:
      - uses: actions/checkout@v7
      - name: Check whether to refresh and deploy
        id: check
        run: |
          fetched=$(jq -r '.fetchedAt // ""' data/store-prices/index.json)
          today=$(TZ=Pacific/Auckland date +%F)
          hour=$(TZ=Pacific/Auckland date +%-H)
          event="${{ github.event_name }}"
          attempt="${{ github.run_attempt }}"
          force="${{ github.event.inputs.force }}"
          # Grocer republishes Woolworths' prices around 05:00 NZ, so the
          # midnight pull only reaches the previous day's scrape. The source's
          # own date, not our run date, says whether today's prices are in.
          wow_source=$(jq -r '.sourceDate // ""' data/woolworths-prices/index.json 2>/dev/null || true)
          wow=false
          if [ "$wow_source" != "$today" ]; then
            wow=true
          fi
          run=true
          refresh=false
          if [ "$event" = "schedule" ] || [ "$event" = "workflow_dispatch" ]; then
            # The external dispatcher is the clock, with the fallback schedule
            # above delivering whatever GitHub feels like. A dispatch at 23:00
            # NZ (winter's 11:00 UTC) must be a no-op rather than a wasted full
            # pull, so only missing prices trigger one. The fetched date keeps
            # retries idempotent, and a stale Woolworths source still triggers
            # the cheap Woolworths-only pull on the morning dispatches.
            if [ "$fetched" != "$today" ] || [ "$force" = "true" ]; then
              refresh=true
            elif [ "$wow" != "true" ]; then
              run=false
            fi
          elif [ "$attempt" -gt 1 ] || [ "$fetched" != "$today" ]; then
            # A re-run of any push, or a push while today's prices are
            # missing, must pull every store, not just redeploy.
            refresh=true
          fi
          {
            echo "run=$run"
            echo "refresh=$refresh"
            echo "wow=$wow"
          } >> "$GITHUB_OUTPUT"
          echo "Event $event, attempt $attempt, Auckland hour $hour, prices dated $fetched, Woolworths source $wow_source."
          if [ "$refresh" = "true" ]; then
            echo "Refreshing all stores for $today."
          elif [ "$wow" = "true" ]; then
            echo "Foodstuffs prices are current; retrying the Woolworths snapshot for $today."
          else
            echo "Prices are current; no refresh needed."
          fi

  build:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check JavaScript syntax
        # Neither this nor the unit tests need npm install, so a broken commit
        # fails here instead of after the 300-minute price refresh.
        run: |
          node --check app.js
          node --check scanner.js
      - name: Run unit tests
        run: npm test
      - name: Install dependencies
        run: npm ci
      - name: Refresh every store's prices
        if: github.ref == 'refs/heads/main' && needs.gate.outputs.refresh == 'true'
        run: npm run prices:refresh
        env:
          CONCURRENCY: 6
      - name: Refresh Woolworths prices
        # Grocer publishes the new day's Woolworths prices around 05:00 NZ, well
        # after the midnight run, so keep pulling only Woolworths until the
        # published snapshot is dated today. The full refresh above already
        # pulled it once, so this fills in the rest of the morning.
        if: github.ref == 'refs/heads/main' && needs.gate.outputs.wow == 'true' && needs.gate.outputs.refresh != 'true'
        run: npm run grocer:refresh
      - name: Verify every store was refreshed
        if: github.ref == 'refs/heads/main' && needs.gate.outputs.refresh == 'true'
        run: |
          today=$(TZ=Pacific/Auckland date +%F)
          fetched=$(jq -r '.fetchedAt // ""' data/store-prices/index.json)
          branches=$(jq '.stores | length' data/store-prices/index.json)
          if [ "$fetched" != "$today" ]; then
            echo "::error::Store prices are dated $fetched, expected $today."
            exit 1
          fi
          if [ "$branches" -lt 200 ]; then
            echo "::error::Only $branches branches were refreshed."
            exit 1
          fi
          echo "Refreshed $branches branches for $today."
      - name: Refresh branch stock coverage
        if: github.ref == 'refs/heads/main' && needs.gate.outputs.refresh == 'true'
        run: |
          # The midnight dispatcher must not pull coverage every night; only an
          # explicit force run does it outside Sunday.
          if [ "${{ github.event.inputs.force }}" != "true" ] && [ "$(TZ=Pacific/Auckland date +%u)" != "7" ]; then
            echo "Branch stock coverage refreshes on Sundays."
            exit 0
          fi
          npm run coverage:pull
      - name: Verify demo staples never fall back to an estimate
        # Runs on every build, not just refresh days: the committed data and the
        # staple mapping must agree before anything is published. The refresh
        # also runs this check so a new catalogue can never commit past it.
        run: npm run staples:check
      - name: Commit refreshed prices
        # A Woolworths-only retry must be committed too, or the next dispatch
        # sees the same stale source date and pulls it again.
        if: github.ref == 'refs/heads/main' && (needs.gate.outputs.refresh == 'true' || needs.gate.outputs.wow == 'true')
        env:
          FULL_REFRESH: ${{ needs.gate.outputs.refresh }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Prices unchanged."
            exit 0
          fi
          today=$(TZ=Pacific/Auckland date +%F)
          if [ "$FULL_REFRESH" = "true" ]; then
            message="Refresh all store prices for $today"
          else
            message="Refresh Woolworths prices for $today"
          fi
          git commit -m "$message"
          git push origin HEAD:main
      - name: Stage the published site
        # Publish only what the browser loads. Test suites, pipeline scripts and
        # package metadata stay in the repository, not on the web.
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R app.html app.css app.js scanner.js styles.css index.html \
                demo-sku-map.js .nojekyll data vendor _site/
          echo "Staged $(find _site -type f | wc -l) files, $(du -sh _site | cut -f1)."
      - name: Verify the staged site
        # A new asset missing from the copy above, or a dev file that slips in,
        # fails here instead of publishing a broken or bloated site.
        run: |
          # vendor/zxing.min.js is loaded by scanner.js, not by the HTML, so the
          # shipped assets are listed here as well as the referenced ones below.
          for required in app.html app.css app.js scanner.js styles.css \
                          index.html demo-sku-map.js .nojekyll data \
                          data/catalogue.js data/store-prices \
                          data/woolworths-prices vendor/zxing.min.js; do
            if [ ! -e "_site/$required" ]; then
              echo "::error::_site is missing $required; add it to the staging step."
              exit 1
            fi
          done
          for unwanted in test scripts package.json package-lock.json node_modules; do
            if [ -e "_site/$unwanted" ]; then
              echo "::error::The published site must not contain $unwanted."
              exit 1
            fi
          done
          missing=0
          while read -r ref; do
            path="${ref%%\?*}"
            case "$path" in http*|data:*|'#'*|"") continue ;; esac
            if [ ! -f "_site/$path" ]; then
              echo "::error::_site is missing $path, which the pages reference."
              missing=1
            fi
          done < <(grep -ohE '(src|href)="[^"]+"' app.html index.html | sed -E 's/^(src|href)="//; s/"$//')
          exit "$missing"
      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install smoke-test dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run live availability and barcode smoke test
        id: smoke
        # The first attempt can lose a race with Pages propagation or with the
        # outside image CDN the product cards load from. The retry below keeps
        # that from turning into a red deploy, and the job still fails if the
        # retry fails too, so a real regression is never waved through.
        continue-on-error: true
        run: npm run smoke:live
        env:
          SMOKE_URL: ${{ needs.deploy.outputs.page_url }}
      - name: Retry the smoke test once after a pause
        if: steps.smoke.outcome == 'failure'
        run: |
          echo "First smoke attempt failed; waiting a minute for the deployment and CDN to settle."
          sleep 60
          npm run smoke:live
        env:
          SMOKE_URL: ${{ needs.deploy.outputs.page_url }}
      - name: Publish smoke failure details
        if: failure()
        run: |
          if [ -f smoke-failure.txt ]; then
            {
              echo "### Smoke failure"
              echo '```'
              cat smoke-failure.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload failure screenshot
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-failure
          path: |
            smoke-failure.png
            smoke-failure.txt
          if-no-files-found: ignore
