name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Midnight in Auckland, including daylight-saving changes.
    - cron: "0 0 * * *"
      timezone: "Pacific/Auckland"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh store prices
        if: github.ref == 'refs/heads/main' && github.event_name != 'push'
        run: npm run prices:refresh
      - name: Refresh branch stock coverage
        if: github.ref == 'refs/heads/main' && github.event_name != 'push'
        run: |
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ "$(TZ=Pacific/Auckland date +%u)" != "7" ]; then
            echo "Branch stock coverage refreshes on Sundays."
            exit 0
          fi
          npm run coverage:pull
      - name: Commit refreshed prices
        if: github.ref == 'refs/heads/main' && github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Prices unchanged."
            exit 0
          fi
          git commit -m "Refresh store prices for $(TZ=Pacific/Auckland date +%F)"
          git push origin HEAD:main
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

  deploy:
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install smoke-test dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run live availability and barcode smoke test
        run: npm run smoke:live
        env:
          SMOKE_URL: ${{ needs.deploy.outputs.page_url }}
      - name: Publish smoke failure details
        if: failure()
        run: |
          if [ -f smoke-failure.txt ]; then
            {
              echo "### Smoke failure"
              echo '```'
              cat smoke-failure.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-failure
          path: |
            smoke-failure.png
            smoke-failure.txt
          if-no-files-found: ignore
