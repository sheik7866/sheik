name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Auckland is UTC+13 in summer and UTC+12 in winter. Three off-peak
    # triggers cover both offsets; the gate job keeps the first one that lands
    # at 00:00–04:00 in Auckland and has not already refreshed today's prices,
    # so later triggers retry a delayed or dropped run without repeating work.
    - cron: "7 11 * * *"
    - cron: "7 12 * * *"
    - cron: "7 13 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  # A deploy must not cancel the longer nightly price refresh.
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for an Auckland midnight refresh
        id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          hour=$(TZ=Pacific/Auckland date +%-H)
          today=$(TZ=Pacific/Auckland date +%F)
          fetched=$(jq -r '.fetchedAt // ""' data/store-prices/index.json)
          if [ "$hour" -le 4 ] && [ "$fetched" != "$today" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Refreshing: Auckland hour $hour, prices dated $fetched."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping: Auckland hour $hour, prices dated $fetched."
          fi

  build:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh every store's prices
        if: github.ref == 'refs/heads/main' && github.event_name != 'push'
        run: npm run prices:refresh
        env:
          CONCURRENCY: 6
      - name: Verify every store was refreshed
        if: github.ref == 'refs/heads/main' && github.event_name != 'push'
        run: |
          today=$(TZ=Pacific/Auckland date +%F)
          fetched=$(jq -r '.fetchedAt // ""' data/store-prices/index.json)
          branches=$(jq '.stores | length' data/store-prices/index.json)
          if [ "$fetched" != "$today" ]; then
            echo "::error::Store prices are dated $fetched, expected $today."
            exit 1
          fi
          if [ "$branches" -lt 200 ]; then
            echo "::error::Only $branches branches were refreshed."
            exit 1
          fi
          echo "Refreshed $branches branches for $today."
      - name: Refresh branch stock coverage
        if: github.ref == 'refs/heads/main' && github.event_name != 'push'
        run: |
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ "$(TZ=Pacific/Auckland date +%u)" != "7" ]; then
            echo "Branch stock coverage refreshes on Sundays."
            exit 0
          fi
          npm run coverage:pull
      - name: Commit refreshed prices
        if: github.ref == 'refs/heads/main' && github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Prices unchanged."
            exit 0
          fi
          git commit -m "Refresh all store prices for $(TZ=Pacific/Auckland date +%F)"
          git push origin HEAD:main
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

  deploy:
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install smoke-test dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run live availability and barcode smoke test
        run: npm run smoke:live
        env:
          SMOKE_URL: ${{ needs.deploy.outputs.page_url }}
      - name: Publish smoke failure details
        if: failure()
        run: |
          if [ -f smoke-failure.txt ]; then
            {
              echo "### Smoke failure"
              echo '```'
              cat smoke-failure.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-failure
          path: |
            smoke-failure.png
            smoke-failure.txt
          if-no-files-found: ignore
